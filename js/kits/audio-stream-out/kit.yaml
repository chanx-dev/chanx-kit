name: audio-stream-out
title: Audio stream out
description: >-
  Speak text to a session's listeners from any text-to-speech provider. Speaks the
  synthesizer contract; provider kits plug in audio. Utterances queue in order, an
  interruption clears them, late joiners are replayed, and playback marks record what
  was actually heard.
version: 0.1.0
tier: core
role: foundation
area: voice
tags: [audio, text-to-speech, speech, streaming]
authors: ["Huy Nguyen <ndhgl99@gmail.com>"]

requires:
  - media-stream-out

implements: [synthesizer@1]
contract_topic: SynthesizerTopic

dependencies:
  - "@chanx-js/server@^2.2.1"
  - "zod@^4.1.0"

optional:
  tests:
    dependencies:
      - "vitest@^3.2.4"
