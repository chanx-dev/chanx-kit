site_name: chanx-kit
site_description: Realtime features you copy into your app. Notifications, chat, presence, AI agent streaming and voice, for Node, Python and Go servers, with React UI.
site_url: https://kit.chanx.dev/
repo_url: https://github.com/chanx-dev/chanx-kit
repo_name: chanx-dev/chanx-kit
edit_uri: edit/main/
copyright: MIT licensed
# Build inputs and the brand guide sit in docs/ for people browsing the repo; not pages.
exclude_docs: |
  assets/brand/README.md
  *.py
  recipes.yaml

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/chanx-kit-wordmark-dark.svg
  favicon: assets/brand/favicon.ico
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode

plugins:
  - search
  - tags
  # Kit pages and the API reference are generated at build time from copit-registry.json,
  # each kit's README and the frozen contracts, so docs cannot drift from the code.
  - gen-files:
      scripts:
        - docs/gen_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  # The Go and Node kit pages became tabs on each kit's page.
  - redirects:
      redirect_maps:
        go/index.md: kits/index.md
        js/index.md: kits/index.md
        go/ag-ui.md: kits/ag-ui.md
        go/notification.md: kits/notification.md
        go/presence.md: kits/presence.md
        go/redis-presence-store.md: kits/redis-presence-store.md
        go/room-chat.md: kits/room-chat.md
        js/ag-ui.md: kits/ag-ui.md
        js/notification.md: kits/notification.md
        js/presence.md: kits/presence.md
        js/redis-presence-store.md: kits/redis-presence-store.md
        js/room-chat.md: kits/room-chat.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Turns :material-x: into an inline SVG; without it the shortcodes render verbatim.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/kits.css
  - stylesheets/brand.css
extra_javascript:
  - javascripts/kit-filter.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chanx-dev/chanx-kit

watch:
  - python
  - go
  - js
  - copit-registry.json


hooks:
  - docs/hooks.py
