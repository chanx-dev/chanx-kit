version: 1
name: chanx-kit-ui
title: chanx-kit UI
description: Copy-in UI for chanx-kit contracts. Framework-free cores, React components.
source: github:chanx-dev/chanx-kit
homepage: https://github.com/chanx-dev/chanx-kit

ecosystem: node

root: ui
default_tier: core

variants: [react]
# copit selects these at `registry add` from the project's package.json.
detect:
  react: {packages: [react]}

tier_rules:
  core: [core]

install:
  target: src/chanx-kit
  exclude:
    - "kit.yaml"
    - "tests/**"
