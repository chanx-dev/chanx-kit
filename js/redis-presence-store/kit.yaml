name: redis-presence-store
title: Redis presence store
description: >-
  Shared presence roster backed by Redis, so presence stays correct across several
  processes, and across Python, Go and Node servers on one Redis.
version: 0.1.0
tier: contrib
role: store
area: presence
tags: [presence, redis, scaling]
authors: ["Huy Nguyen <ndhgl99@gmail.com>"]

requires:
  - presence

dependencies:
  - "redis@^6.3.1"

optional:
  tests:
    dependencies:
      - "vitest@^3.2.4"
