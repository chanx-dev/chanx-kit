name: fake-voice
title: Fake voice
description: >-
  A transcriber and a synthesizer that need no provider and no key: speech is
  transcribed as a scripted sentence, text is spoken as a tone per word. For demos, UI
  work and CI. Install both, or one part with `--only stt` or `--only tts`.
version: 0.1.0
tier: core
role: provider
tags: [audio, speech-to-text, text-to-speech, testing, demo]
authors: ["Huy Nguyen <ndhgl99@gmail.com>"]

requires:
  - audio-stream-in
  - audio-stream-out

implements: [transcriber@1, synthesizer@1]

dependencies:
  - "go.chanx.dev/v2@v2.2.0"

parts:
  stt:
    include: [transcriber.go, transcriber_test.go]
    requires: [audio-stream-in]
    implements: [transcriber@1]
  tts:
    include: [synthesizer.go, synthesizer_test.go]
    requires: [audio-stream-out]
    implements: [synthesizer@1]
