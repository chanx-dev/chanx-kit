name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Local hooks shell out to uv, which this job lacks; other jobs run them.
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: registry-index,kit-contracts

  registry:
    name: Validate registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Check registry metadata and index freshness
        run: uv run python scripts/registry.py check
      - name: Check the feature recipes and install commands in the docs
        run: uv run python scripts/recipes.py check

  test:
    name: ${{ matrix.backend }} / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        backend: [fastapi, django]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      # --no-default-groups is load-bearing: the defaults install both frameworks,
      # so a kit secretly importing the other one would still pass this cell.
      - name: Run kit tests
        run: |
          uv run --no-default-groups \
                 --extra ${{ matrix.backend }} \
                 --group dev-${{ matrix.backend }} --group registry \
                 pytest python/kits tests -q
        env:
          CHANX_KIT_BACKEND: ${{ matrix.backend == 'django' && 'channels' || 'fast_channels' }}

  conformance:
    name: Install conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install every kit and import it
        run: uv run python scripts/conformance.py

  ui:
    name: Demo UI types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/sandbox/package-lock.json
      - run: npm ci --prefix ui/sandbox
      - name: Generate the client from the sandbox AsyncAPI schema
        run: npm run --prefix ui/sandbox gen
      - run: git diff --exit-code ui/sandbox/src/generated
      - run: npm run --prefix ui/sandbox typecheck

  ui-kits:
    name: UI kits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: npm ci --prefix ui
      - run: npm ci --prefix js
      # Each contract.ts is regenerated from its server kit, and the Go and JS kits must
      # generate the same types, so a drift fails here rather than in someone's app.
      - name: Contracts match the server kits
        run: uv run --extra fastapi --group dev-fastapi python scripts/contracts.py check
      - run: npm run --prefix ui typecheck
      - run: npm test --prefix ui
      - name: The shadcn index builds
        run: uv run python scripts/shadcn.py "$RUNNER_TEMP/r"

  go-kits:
    name: Go kits
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  js-kits:
    name: JS kits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci --prefix js
      - run: npm run --prefix js typecheck
      - run: npm test --prefix js

  templates:
    name: Template ${{ matrix.template }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - go-nethttp-react
          - go-chi-react
          - go-gin-react
          - go-echo-react
          - go-fiber-react
          - express-react
          - fastify-react
          - hono-react
    env:
      TEMPLATE: templates/${{ matrix.template }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create a project with copit create
        run: |
          APP="$RUNNER_TEMP/app"
          uv run --only-group registry copit create "$TEMPLATE" "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
      - name: Build the server
        working-directory: ${{ env.APP }}
        run: |
          if [ -f go.mod ]; then go vet ./...; else npm ci && npm run typecheck; fi
      - run: npm ci --prefix web
        working-directory: ${{ env.APP }}
      - name: The committed client matches the server's schema
        working-directory: ${{ env.APP }}
        run: |
          npm run --prefix web gen:offline
          diff -r web/src/generated "$GITHUB_WORKSPACE/$TEMPLATE/web/src/generated"
      - name: Typecheck and build the UI
        run: npm run --prefix web build
        working-directory: ${{ env.APP }}
      - name: Drive the running app through chanx-js
        working-directory: ${{ env.APP }}
        run: |
          if [ -f go.mod ]; then go build -o server . && ./server & else npm start & fi
          trap 'kill $!' EXIT
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8000/asyncapi.json > /dev/null && break; sleep 1; done
          npm run --prefix web gen
          diff -r web/src/generated "$GITHUB_WORKSPACE/$TEMPLATE/web/src/generated"
          node "$GITHUB_WORKSPACE/scripts/template_smoke.mjs" . http://127.0.0.1:8000

  template:
    name: Template ${{ matrix.template }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: fastapi-react
            serve: .venv/bin/uvicorn app.main:app --port 8000
            ready: /asyncapi.json
          - template: django-react
            serve: .venv/bin/python manage.py migrate -v0 && .venv/bin/python manage.py runserver 8000 --noreload
            ready: /asyncapi/schema/
    env:
      TEMPLATE: templates/${{ matrix.template }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: templates/${{ matrix.template }}/web/package-lock.json
      - name: Lockfiles are current
        run: uv lock --check --project "$TEMPLATE"
      - name: Create a project with copit create
        run: |
          APP="$RUNNER_TEMP/app"
          uv run --only-group registry copit create "$TEMPLATE" "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
      - run: uv sync
        working-directory: ${{ env.APP }}
      - run: npm ci --prefix web
        working-directory: ${{ env.APP }}
      - name: The committed client matches the server's schema
        working-directory: ${{ env.APP }}
        run: |
          npm run --prefix web gen:offline
          diff -r web/src/generated "$GITHUB_WORKSPACE/$TEMPLATE/web/src/generated"
      - name: Typecheck and build the UI
        run: npm run --prefix web build
        working-directory: ${{ env.APP }}
      - name: Drive the running app through chanx-js
        working-directory: ${{ env.APP }}
        run: |
          (${{ matrix.serve }}) &
          trap 'kill $!' EXIT
          for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:8000${{ matrix.ready }}" > /dev/null && break; sleep 1; done
          npm run --prefix web gen
          diff -r web/src/generated "$GITHUB_WORKSPACE/$TEMPLATE/web/src/generated"
          node "$GITHUB_WORKSPACE/scripts/template_smoke.mjs" . http://127.0.0.1:8000

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Build documentation
        run: uv run mkdocs build --strict
        env:
          DISABLE_MKDOCS_2_WARNING: "true"

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install
        run: uv sync
      - run: uv run ruff check src python scripts tests docs templates
      - run: uv run ruff format --check src python scripts tests docs templates
      - run: uv run pyright
