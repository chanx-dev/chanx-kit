name: ag-ui
title: AG-UI thread
description: >-
  Headless state for one AG-UI conversation: messages folded from streamed events,
  the run in flight, run and cancel. Replay-safe when several tabs share a thread.
version: 0.2.0
tier: core
role: feature
area: agents
tags: [agent, ag-ui, headless]
authors: ["Huy Nguyen <ndhgl99@gmail.com>"]

consumes: [ag-ui@2]

dependencies:
  - "@chanx-js/client@^0.1.2"

variants:
  react:
    include: ["react/**"]
