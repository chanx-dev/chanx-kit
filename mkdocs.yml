site_name: chanx-kit
site_description: A collection of composable, copy-in WebSocket kits for chanx.
site_url: https://huynguyengl99.github.io/chanx-kit/
repo_url: https://github.com/huynguyengl99/chanx-kit
repo_name: huynguyengl99/chanx-kit
edit_uri: edit/main/
copyright: MIT licensed
# The brand guide sits next to the assets for people browsing the repo; it is not a page.
exclude_docs: |
  assets/brand/README.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/chanx-kit-wordmark-dark.svg
  favicon: assets/brand/favicon.ico
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode

plugins:
  - search
  - tags
  # Kit pages and the API reference are generated at build time from copit-registry.json,
  # each kit's README and the frozen contracts, so docs cannot drift from the code.
  - gen-files:
      scripts:
        - docs/gen_pages.py
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Turns :material-x: into an inline SVG; without it the shortcodes render verbatim.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/kits.css
  - stylesheets/brand.css
extra_javascript:
  - javascripts/kit-filter.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/huynguyengl99/chanx-kit

watch:
  - kits
  - copit-registry.json
