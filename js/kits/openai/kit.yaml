name: openai
title: OpenAI
description: >-
  OpenAI behind the voice contracts: realtime transcription and streamed text-to-speech.
  Install both, or one part with `--only stt` or `--only tts`. The API key stays on
  the server.
version: 0.1.0
tier: contrib
role: provider
tags: [audio, speech-to-text, text-to-speech, openai, provider]
authors: ["Huy Nguyen <ndhgl99@gmail.com>"]

requires:
  - audio-stream-in
  - audio-stream-out

implements: [transcriber@1, synthesizer@1]

dependencies:
  - "@chanx-js/server@^2.2.0"
  - "ws@^8.18.0"
  - "@types/ws@^8.18.0"

optional:
  tests:
    dependencies:
      - "vitest@^3.2.4"

parts:
  stt:
    include: [openai.ts, transcriber.ts, tests/transcriber.test.ts]
    requires: [audio-stream-in]
    implements: [transcriber@1]
    dependencies: ["ws@^8.18.0", "@types/ws@^8.18.0"]
  tts:
    include: [openai.ts, synthesizer.ts, tests/synthesizer.test.ts]
    requires: [audio-stream-out]
    implements: [synthesizer@1]
    dependencies: ["@chanx-js/server@^2.2.0"]
